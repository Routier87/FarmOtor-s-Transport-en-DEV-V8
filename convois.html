<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<title>Convois organisés</title>
<link rel="stylesheet" href="style.css">
</head>

<body>

<h1>Convois organisés</h1>

<div id="convoys"></div>

<script src="config.js"></script>

<script>

const API = API_URL;

async function loadConvoys(){

const res = await fetch(API + "/convoys");

const convoys = await res.json();

const container = document.getElementById("convoys");

container.innerHTML="";

convoys.forEach(c=>{

container.innerHTML += `

<div class="card">

<h3>🚛 ${c.depart} ➜ ${c.arrivee}</h3>

<p>
${c.entrepriseDepart} ➜ ${c.entrepriseArrivee}
</p>

<p>
📅 ${c.date} | ⏰ ${c.heure} | 🖥️ ${c.serveur}
</p>

</div>

`;

});

}

loadConvoys();

</script>

</body>
</html>
