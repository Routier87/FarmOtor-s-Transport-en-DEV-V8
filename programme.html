<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<title>Créer un convoi</title>
<link rel="stylesheet" href="style.css">
</head>

<body data-staff="true">

<h1>Créer un convoi</h1>

<form id="convoyForm">

<input id="entrepriseDepart" placeholder="Entreprise départ" required>
<input id="depart" placeholder="Ville départ" required>

<input id="entrepriseArrivee" placeholder="Entreprise arrivée" required>
<input id="arrivee" placeholder="Ville arrivée" required>

<input id="date" type="date" required>
<input id="heure" type="time" required>

<select id="serveur">
<option>TMP</option>
<option>SIMU1</option>
<option>SIMU2</option>
<option>ProMod</option>
<option>ProMod Arcade</option>
<option>Autre</option>
</select>

<button type="submit">Créer le convoi</button>

</form>

<script src="config.js"></script>

<script>

const API = API_URL;

document.getElementById("convoyForm").addEventListener("submit", async (e)=>{

e.preventDefault();

const convoy = {

entrepriseDepart: document.getElementById("entrepriseDepart").value,
depart: document.getElementById("depart").value,

entrepriseArrivee: document.getElementById("entrepriseArrivee").value,
arrivee: document.getElementById("arrivee").value,

date: document.getElementById("date").value,
heure: document.getElementById("heure").value,

serveur: document.getElementById("serveur").value

};

const res = await fetch(API + "/convoys",{

method:"POST",

headers:{
"Content-Type":"application/json"
},

body:JSON.stringify(convoy)

});

if(res.ok){

alert("Convoi créé !");

window.location.href="convois.html";

}else{

alert("Erreur création convoi");

}

});

</script>

</body>
</html>
